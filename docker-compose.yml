services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: growth_funnel
      POSTGRES_PASSWORD: growth_funnel_dev_password
      POSTGRES_DB: growth_funnel_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_funnel -d growth_funnel_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
