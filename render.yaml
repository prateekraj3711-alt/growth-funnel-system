# Render's free plan covers Web Services but not Background Workers
# (https://render.com/docs/free). For the free public demo, the API and the
# worker run as two independent modules inside ONE free Web Service via
# deploy/render-combined-start.mjs — see that file's comment for why this
# doesn't change the actual architecture. A paid deployment can instead
# split this back into two services (web + worker) with no code changes:
# just two render.yaml entries pointing at apps/api/dist/server.js and
# worker/dist/worker.js respectively.
services:
  - type: web
    name: growth-funnel-system
    runtime: node
    plan: free
    buildCommand: >-
      npm install --include=dev &&
      npm run build --workspace packages/shared &&
      npm run build --workspace packages/validation &&
      npx prisma generate --schema prisma/schema.prisma &&
      npm run build --workspace apps/api &&
      npm run build --workspace worker
    startCommand: >-
      npx prisma migrate deploy --schema prisma/schema.prisma &&
      node deploy/render-combined-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: MAX_JOB_ATTEMPTS
        value: "5"
      - key: JOB_POLL_INTERVAL_MS
        value: "1000"
      - key: JOB_LEASE_TIMEOUT_MS
        value: "60000"
      - key: PRIVACY_POLICY_VERSION
        value: "1.0.0"
      - key: META_ENABLED
        value: "false"
      - key: META_PIXEL_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_TEST_EVENT_CODE
        sync: false
      - key: META_SIMULATE_FAILURE
        value: "false"
      - key: AIRTABLE_ENABLED
        value: "false"
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_TABLE_ID
        sync: false
      - key: AIRTABLE_SIMULATE_FAILURE
        value: "false"
